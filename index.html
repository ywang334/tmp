<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>3DGS Web Renderer Demo</title>
  <link rel="stylesheet" href="./styles.css">
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three.module.min.js"
      }
    }
  </script>
</head>
<body>
  <header class="toolbar">
    <div>
      <p>VIDEO OBJECT 3D GRAPH</p>
      <h1>3D Gaussian Splatting viewer</h1>
    </div>
    <div class="actions" aria-label="Camera and renderer controls">
      <button id="anchor-view" type="button">View1</button>
      <button id="overview" type="button">Overview</button>
      <button id="toggle-annotation" type="button" aria-pressed="true">Hide bbox</button>
      <button id="reload-scene" type="button">Reload</button>
    </div>
  </header>

  <main>
    <section class="viewer-shell" aria-label="Interactive 3DGS scene">
      <div class="viewer-root" id="viewer-root">
        <div class="loading-state" id="loading-state">
          <span class="spinner" aria-hidden="true"></span>
          <strong>Loading Gaussian splats</strong>
        </div>
        <div class="scene-legend">
          <span><i></i>Ground-truth 3D bbox and heading</span>
        </div>
      </div>
      <footer class="status-bar">
        <span id="status">Preparing viewer</span>
        <span>Drag: orbit | wheel: zoom | right drag: pan</span>
      </footer>
    </section>

  </main>

  <pre class="fatal-error is-hidden" id="fatal-error"></pre>
  <script type="module" src="./app.js"></script>
</body>
</html>
